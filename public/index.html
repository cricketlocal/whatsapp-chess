<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#d4af37">
  <title>WhatsApp Chess</title>
  <meta name="description" content="Play chess with a friend by sending each turn on WhatsApp.">
  <meta property="og:title" content="WhatsApp Chess — your move">
  <meta property="og:description" content="Tap to open the board and play this turn.">
  <meta property="og:type" content="website">
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <main class="stage">
    <header class="chrome" id="header">
      <button type="button" class="menu-btn" id="menu-btn" aria-label="Menu" aria-expanded="false">☰</button>
      <h1 id="title">WhatsApp Chess</h1>
      <div class="clocks" aria-label="Total thinking time">
        <div class="clock" id="clock-w" data-side="w"><span>White</span><b>0:00</b></div>
        <div class="clock" id="clock-b" data-side="b"><span>Black</span><b>0:00</b></div>
      </div>
    </header>

    <div class="menu-drop" id="menu" hidden>
      <button type="button" class="btn btn-ai" id="btn-ai">Play vs AI</button>
      <label class="ai-diff-label" for="ai-diff">Level
        <select id="ai-diff" aria-label="AI difficulty">
          <option value="1">Easy</option>
          <option value="2" selected>Medium</option>
          <option value="3">Hard</option>
        </select>
      </label>
      <button type="button" class="btn btn-wa" id="btn-whatsapp">Send this turn on WhatsApp</button>
      <button type="button" class="btn btn-ghost" id="btn-copy">Copy link</button>
      <button type="button" class="btn btn-ghost" id="btn-new">New game (you White)</button>
      <p class="help" id="help-text">
        After you move, tap <strong>Send this turn on WhatsApp</strong>.
        Your opponent opens the link, moves, and sends it back.
        Or tap <strong>Play vs AI</strong> for a solo game on this device.
      </p>
      <ol class="moves" id="moves"></ol>
    </div>

    <section class="status-slim" id="status-card">
      <p class="you-line" id="you-line">You are White</p>
      <p class="turn-line" id="turn-line">Your move</p>
      <p class="last-line" id="last-line"></p>
    </section>

    <div class="captured-tray" id="captured-black" aria-label="Pieces captured by Black">
      <span class="captured-label">Black took</span>
      <div class="captured-pieces" id="captured-black-pieces"></div>
    </div>

    <div class="board-wrap board-wrap-3d">
      <div class="ranks ranks-left" id="ranks-left"></div>
      <div class="board3d" id="board3d" role="img" aria-label="3D chess board"></div>
      <div class="ranks ranks-right" id="ranks-right"></div>
      <div class="files" id="files"></div>
      <div class="board" id="board" hidden></div>
      <div class="fx-layer" id="fx-layer" hidden aria-hidden="true"></div>
      <div class="orbit-btns" role="group" aria-label="Rotate board">
        <button type="button" class="orbit-btn" id="btn-orbit-left" aria-label="Rotate left">◀</button>
        <button type="button" class="orbit-btn" id="btn-orbit-reset" aria-label="Reset view">⊙</button>
        <button type="button" class="orbit-btn" id="btn-orbit-right" aria-label="Rotate right">▶</button>
      </div>
    </div>

    <div class="captured-tray" id="captured-white" aria-label="Pieces captured by White">
      <span class="captured-label">White took</span>
      <div class="captured-pieces" id="captured-white-pieces"></div>
    </div>

    <div class="promo" id="promo" hidden>
      <p>Promote pawn to</p>
      <div class="promo-btns" id="promo-btns"></div>
    </div>

    <p class="hint-out" id="hint-out" hidden></p>
  </main>
  <canvas id="confetti" aria-hidden="true"></canvas>
  <script type="module" src="app.js?v=20260921d"></script>
</body>
</html>
