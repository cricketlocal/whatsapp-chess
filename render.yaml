services:
  - type: web
    name: whatsapp-chess
    runtime: node
    plan: free
    branch: main
    buildCommand: npm install
    startCommand: node server.mjs
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: XAI_API_KEY
        sync: false
      - key: CHESS_ADMIN_KEY
        sync: false
